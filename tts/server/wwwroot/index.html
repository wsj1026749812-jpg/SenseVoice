<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piper TTS Lite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL CPU TEXT TO SPEECH</p>
        <h1>Piper TTS Lite</h1>
      </div>
      <div id="health" class="health" aria-live="polite">检查服务中</div>
    </header>

    <section class="workspace" aria-label="语音合成工作台">
      <section class="panel compose-panel">
        <div class="panel-heading">
          <div>
            <p class="kicker">单条合成</p>
            <h2>输入文本</h2>
          </div>
          <label class="counter" for="text">0 / 2000</label>
        </div>
        <textarea id="text" maxlength="2000" spellcheck="false">您好，这是一段在本地 CPU 上运行的中文语音合成测试。</textarea>
        <div class="control-grid">
          <label class="control">
            <span>语速</span>
            <input id="length-scale" type="range" min="0.7" max="1.5" value="1" step="0.1">
            <output id="length-scale-value">1.0x</output>
          </label>
          <label class="control">
            <span>音色变化</span>
            <input id="noise-scale" type="range" min="0" max="1.2" value="0.667" step="0.05">
            <output id="noise-scale-value">0.67</output>
          </label>
        </div>
        <div class="actions">
          <button id="synthesize" class="primary" type="button">生成语音</button>
          <button id="stream" class="secondary" type="button">流式试播</button>
          <button id="clear" class="icon-button" type="button" title="清空文本" aria-label="清空文本">×</button>
        </div>
        <p id="single-status" class="status" aria-live="polite"></p>
      </section>

      <section class="panel result-panel">
        <div class="panel-heading">
          <div>
            <p class="kicker">输出</p>
            <h2>音频与指标</h2>
          </div>
          <a id="download" class="download is-hidden" href="#" download>下载 WAV</a>
        </div>
        <audio id="audio" controls class="is-hidden"></audio>
        <div id="metrics" class="metrics empty">生成后显示音频时长、CPU 与实时系数。</div>
        <p class="tip">流式接口返回 22.05 kHz 单声道 PCM，可直接用于本地实时播放或二次封装。</p>
      </section>
    </section>

  </main>
  <script src="/app.js"></script>
</body>
</html>
