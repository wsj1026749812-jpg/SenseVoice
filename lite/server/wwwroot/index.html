<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SenseVoice Lite Test</title>
  <style>
    :root { --ink:#18212f; --muted:#667085; --line:#d7dde4; --paper:#fff; --ground:#f4f6f8; --teal:#0c8a7d; --teal-dark:#08645b; --coral:#d8563f; --gold:#d79218; --shadow:0 12px 28px rgba(24,33,47,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--ground); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.5; }
    .topbar { min-height:80px; border-bottom:1px solid var(--line); background:var(--paper); }
    .bar,.main { width:min(1120px,calc(100% - 32px)); margin:0 auto; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }.mark { display:grid; place-items:center; width:38px; height:38px; border-radius:7px; color:#fff; background:var(--teal); font-weight:700; }
    h1,h2,p { margin:0; } h1 { font-size:21px; letter-spacing:0; } h2 { font-size:16px; letter-spacing:0; }.subhead { margin-top:3px; color:var(--muted); font-size:13px; }
    .status { display:flex; align-items:center; gap:8px; color:var(--teal-dark); white-space:nowrap; font-size:13px; }.dot { width:9px; height:9px; border-radius:50%; background:var(--teal); }.status[data-state="busy"] { color:var(--gold); }.status[data-state="busy"] .dot { background:var(--gold); }.status[data-state="error"] { color:var(--coral); }.status[data-state="error"] .dot { background:var(--coral); }
    .main { padding:25px 0 36px; }.grid { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr); gap:18px; }.panel { border:1px solid var(--line); border-radius:8px; background:var(--paper); box-shadow:var(--shadow); }.head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }.body { padding:20px; }
    .source { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:8px; }input[type=file] { min-width:0; padding:9px; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:#fff; }.button { min-height:40px; padding:0 14px; border:1px solid transparent; border-radius:6px; color:#fff; background:var(--teal); font-weight:600; }.button:hover:not(:disabled) { background:var(--teal-dark); }.button.stop { background:var(--coral); }.button.ghost { color:var(--ink); border-color:var(--line); background:#fff; }
    .wavebox { position:relative; height:155px; margin:18px 0; overflow:hidden; border:1px solid var(--line); border-radius:6px; background:#fbfcfd; }canvas { display:block; width:100%; height:100%; }.wave-label { position:absolute; top:12px; left:13px; color:var(--muted); font-size:12px; }.preview { width:100%; min-height:30px; margin-bottom:16px; }.preview:empty { display:none; }.run { display:flex; align-items:center; gap:9px; }.run .button:first-child { flex:1; }
    .metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }.metric { min-height:91px; padding:15px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }.metric-label { color:var(--muted); font-size:12px; }.metric-value { display:block; margin-top:8px; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
    label { display:block; margin-bottom:8px; color:var(--muted); font-size:12px; font-weight:600; }textarea { width:100%; min-height:94px; resize:vertical; padding:11px; border:1px solid var(--line); border-radius:6px; color:var(--ink); line-height:1.55; }textarea:focus,input:focus { outline:2px solid rgba(12,138,125,.25); border-color:var(--teal); }
    .result-panel { margin-top:18px; }.result { min-height:160px; padding:16px; border:1px solid var(--line); border-radius:6px; background:#fbfcfd; }.result-text { font-size:17px; line-height:1.7; word-break:break-word; }.placeholder { color:var(--muted); }.tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:15px; }.tag { padding:5px 8px; border:1px solid #b8d6d1; border-radius:5px; color:var(--teal-dark); background:#f0fbf9; font-size:12px; }.error { min-height:20px; margin:12px 0 0; color:var(--coral); font-size:13px; line-height:1.45; }.error:empty { display:none; }
    @media (max-width:760px) { .bar,.main { width:min(100% - 22px,1120px); }.bar { min-height:74px; gap:8px; padding:12px 0; }.brand { flex:1; }.grid { grid-template-columns:1fr; }.source { grid-template-columns:1fr 1fr; }.source input { grid-column:1/-1; }.mark { width:34px; height:34px; }h1 { font-size:19px; white-space:nowrap; }.run .button:first-child { font-size:13px; white-space:nowrap; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="bar"><div class="brand"><div class="mark" aria-hidden="true">SV</div><div><h1>SenseVoice Lite</h1><p class="subhead">CPU transcription test</p></div></div><div id="status" class="status" data-state="ready"><span class="dot"></span><span id="statusText">Ready</span></div></div></header>
  <main class="main">
    <div class="grid">
      <section class="panel" aria-labelledby="audioTitle"><div class="head"><h2 id="audioTitle">Audio</h2><span id="audioName" class="subhead">No audio selected</span></div><div class="body">
        <div class="source"><input id="fileInput" type="file" accept="audio/*,.wav" aria-label="Choose audio file"><button id="recordButton" class="button" type="button">Record</button><button id="stopButton" class="button stop" type="button" disabled>Stop</button></div>
        <div class="wavebox"><canvas id="waveform"></canvas><span id="waveLabel" class="wave-label">16 kHz mono WAV</span></div><div id="preview" class="preview"></div>
        <div class="run"><button id="transcribeButton" class="button" type="button" disabled>Run transcription</button><button id="resetButton" class="button ghost" type="button">Reset</button></div><p id="error" class="error" role="alert"></p>
      </div></section>
      <section class="panel" aria-labelledby="metricsTitle"><div class="head"><h2 id="metricsTitle">单次运行指标</h2><span class="subhead">CPU / RAM / GGUF</span></div><div class="metrics"><div class="metric"><span class="metric-label">音频时长</span><strong id="durationValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">推理耗时</span><strong id="inferenceValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">请求总耗时</span><strong id="requestValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">CPU 时间</span><strong id="cpuTimeValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">CPU 占用</span><strong id="cpuValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">逻辑核心占用</span><strong id="coresValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">峰值内存</span><strong id="memoryValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">内存占用率</span><strong id="memoryPercentValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">实时速度</span><strong id="speedValue" class="metric-value">--</strong></div><div class="metric"><span class="metric-label">字符准确率</span><strong id="accuracyValue" class="metric-value">--</strong></div></div><div class="body"><label for="referenceText">参考文本（可选，用于计算字符准确率）</label><textarea id="referenceText" placeholder="输入人工正确文本后计算本次识别准确率"></textarea></div></section>
    </div>
    <section class="panel result-panel" aria-labelledby="resultTitle"><div class="head"><h2 id="resultTitle">Transcript</h2><span id="resultMeta" class="subhead"></span></div><div class="body"><div class="result"><p id="resultText" class="result-text placeholder">No result</p><div id="tags" class="tags"></div></div></div></section>
  </main>
  <script>
    const state = { wav:null, duration:0, filename:"audio.wav", recorder:null, stream:null, context:null, analyser:null, frame:0, previewUrl:null };
    const ui = { file:document.querySelector("#fileInput"), record:document.querySelector("#recordButton"), stop:document.querySelector("#stopButton"), run:document.querySelector("#transcribeButton"), reset:document.querySelector("#resetButton"), status:document.querySelector("#status"), statusText:document.querySelector("#statusText"), name:document.querySelector("#audioName"), wave:document.querySelector("#waveform"), waveLabel:document.querySelector("#waveLabel"), preview:document.querySelector("#preview"), error:document.querySelector("#error"), duration:document.querySelector("#durationValue"), inference:document.querySelector("#inferenceValue"), request:document.querySelector("#requestValue"), cpuTime:document.querySelector("#cpuTimeValue"), cpu:document.querySelector("#cpuValue"), cores:document.querySelector("#coresValue"), memory:document.querySelector("#memoryValue"), memoryPercent:document.querySelector("#memoryPercentValue"), speed:document.querySelector("#speedValue"), accuracy:document.querySelector("#accuracyValue"), reference:document.querySelector("#referenceText"), result:document.querySelector("#resultText"), tags:document.querySelector("#tags"), resultMeta:document.querySelector("#resultMeta") };
    const setStatus = (kind,text) => { ui.status.dataset.state=kind; ui.statusText.textContent=text; };
    const setError = (text="") => ui.error.textContent=text;
    const seconds = value => `${value.toFixed(value<10?2:1)} s`;
    function paintWave() { const canvas=ui.wave, ratio=devicePixelRatio||1, width=Math.floor(canvas.clientWidth*ratio), height=Math.floor(canvas.clientHeight*ratio); canvas.width=width; canvas.height=height; const context=canvas.getContext("2d"); context.fillStyle="#fbfcfd"; context.fillRect(0,0,width,height); context.strokeStyle="#d7dde4"; context.lineWidth=ratio; context.beginPath(); context.moveTo(0,height/2); context.lineTo(width,height/2); context.stroke(); if(state.analyser){const data=new Uint8Array(state.analyser.fftSize);state.analyser.getByteTimeDomainData(data);context.strokeStyle="#0c8a7d";context.lineWidth=2*ratio;context.beginPath();data.forEach((value,index)=>{const x=index*width/(data.length-1),y=value/255*height;index?context.lineTo(x,y):context.moveTo(x,y);});context.stroke();state.frame=requestAnimationFrame(paintWave);} }
    function stopWave() { cancelAnimationFrame(state.frame); state.analyser=null; paintWave(); }
    function encodeWav(buffer) { const samples=buffer.getChannelData(0), bytes=new ArrayBuffer(44+samples.length*2), view=new DataView(bytes), text=(offset,value)=>[...value].forEach((char,index)=>view.setUint8(offset+index,char.charCodeAt(0))); text(0,"RIFF");view.setUint32(4,36+samples.length*2,true);text(8,"WAVE");text(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,"data");view.setUint32(40,samples.length*2,true);samples.forEach((sample,index)=>{const value=Math.max(-1,Math.min(1,sample));view.setInt16(44+index*2,value<0?value*32768:value*32767,true);});return new Blob([bytes],{type:"audio/wav"}); }
    async function convert(blob) { const context=new (window.AudioContext||window.webkitAudioContext)(); try { const decoded=await context.decodeAudioData(await blob.arrayBuffer()), offline=new OfflineAudioContext(1,Math.max(1,Math.ceil(decoded.duration*16000)),16000), source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();const mono=await offline.startRendering();return {blob:encodeWav(mono),duration:mono.duration}; } finally { await context.close(); } }
    async function setAudio(blob,filename) { setStatus("busy","Preparing audio");setError();const audio=await convert(blob);if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.wav=audio.blob;state.duration=audio.duration;state.filename=filename.replace(/\.[^.]+$/,"")+".wav";state.previewUrl=URL.createObjectURL(audio.blob);ui.preview.innerHTML="";const player=document.createElement("audio");player.controls=true;player.src=state.previewUrl;ui.preview.append(player);ui.name.textContent=state.filename;ui.duration.textContent=seconds(state.duration);ui.run.disabled=false;ui.reset.disabled=false;setStatus("ready","Ready"); }
    async function record() { try { setError();state.stream=await navigator.mediaDevices.getUserMedia({audio:true});state.context=new (window.AudioContext||window.webkitAudioContext)();const source=state.context.createMediaStreamSource(state.stream);state.analyser=state.context.createAnalyser();state.analyser.fftSize=1024;source.connect(state.analyser);const chunks=[],type=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";state.recorder=new MediaRecorder(state.stream,type?{mimeType:type}:undefined);state.recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};state.recorder.onstop=async()=>{state.stream.getTracks().forEach(track=>track.stop());await state.context.close();state.context=null;stopWave();try{await setAudio(new Blob(chunks,{type:state.recorder.mimeType}),"recording.wav");}catch(error){ui.reset.disabled=false;setStatus("error","Audio error");setError(`Audio conversion failed: ${error.message}`);}};state.recorder.start();ui.record.disabled=true;ui.stop.disabled=false;ui.run.disabled=true;ui.reset.disabled=true;ui.waveLabel.textContent="Recording";setStatus("busy","Recording");paintWave();}catch(error){ui.reset.disabled=false;setStatus("error","Microphone unavailable");setError(`Microphone access failed: ${error.message}`);} }
    function stop() { if(state.recorder&&state.recorder.state!=="inactive")state.recorder.stop();ui.record.disabled=false;ui.stop.disabled=true;setStatus("busy","Preparing audio"); }
    function score(reference,actual) { const a=[...reference.replace(/\s/g,"")],b=[...actual.replace(/\s/g,"")];if(!a.length)return null;let previous=Array.from({length:b.length+1},(_,i)=>i);for(let row=1;row<=a.length;row++){const current=[row];for(let column=1;column<=b.length;column++)current[column]=a[row-1]===b[column-1]?previous[column-1]:1+Math.min(previous[column],current[column-1],previous[column-1]);previous=current;}return Math.max(0,1-previous[b.length]/a.length); }
    function updateAccuracy() { const value=score(ui.reference.value,ui.result.dataset.text||"");ui.accuracy.textContent=value===null?"--":`${(value*100).toFixed(1)}%`; }
    async function transcribe() { if(!state.wav)return;try { setError();setStatus("busy","Transcribing");ui.run.disabled=true;const form=new FormData();form.append("files",state.wav,state.filename);form.append("lang","auto");const start=performance.now(),response=await fetch("/api/v1/asr",{method:"POST",body:form}),elapsed=performance.now()-start,responseText=await response.text();let payload={};try{payload=responseText?JSON.parse(responseText):{};}catch{throw new Error(`服务返回了无效数据 (${response.status})`);}if(!response.ok)throw new Error(payload.detail||`请求失败 (${response.status})`);const item=payload.result[0],inferenceSeconds=item.inference_ms/1000;ui.result.textContent=item.text||"";ui.result.dataset.text=item.text||"";ui.result.classList.remove("placeholder");ui.resultMeta.textContent=item.filename;ui.tags.innerHTML="";[["Language",item.language],["Emotion",item.emotion],["Event",item.event],["ITN",item.itn]].forEach(([label,value])=>{if(!value)return;const tag=document.createElement("span");tag.className="tag";tag.textContent=`${label}: ${value}`;ui.tags.append(tag);});ui.inference.textContent=`${Math.round(item.inference_ms)} ms`;ui.request.textContent=`${Math.round(elapsed)} ms`;ui.cpuTime.textContent=`${Math.round(item.cpu_time_ms)} ms`;ui.cpu.textContent=`${item.cpu_utilization_percent.toFixed(1)}%`;ui.cores.textContent=`${item.cpu_core_equivalents.toFixed(2)} / ${item.processor_count} 核`;ui.memory.textContent=`${item.peak_working_set_mb.toFixed(1)} MB`;ui.memoryPercent.textContent=`${item.memory_utilization_percent.toFixed(2)}%`;ui.speed.textContent=state.duration&&inferenceSeconds?`${(state.duration/inferenceSeconds).toFixed(2)}x`:"--";updateAccuracy();setStatus("ready","Ready");}catch(error){setStatus("error","Request failed");setError(error.message);}finally{ui.run.disabled=!state.wav;} }
    function reset() { if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);Object.assign(state,{wav:null,duration:0,filename:"audio.wav",previewUrl:null});ui.file.value="";ui.preview.innerHTML="";ui.name.textContent="No audio selected";ui.waveLabel.textContent="16 kHz mono WAV";ui.run.disabled=true;ui.result.textContent="No result";ui.result.dataset.text="";ui.result.classList.add("placeholder");ui.tags.innerHTML="";ui.resultMeta.textContent="";ui.reference.value="";[ui.duration,ui.inference,ui.request,ui.cpuTime,ui.cpu,ui.cores,ui.memory,ui.memoryPercent,ui.speed,ui.accuracy].forEach(element=>element.textContent="--");setError();setStatus("ready","Ready");paintWave(); }
    ui.file.addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{await setAudio(file,file.name);}catch(error){setStatus("error","Audio error");setError(`Audio conversion failed: ${error.message}`);}});ui.record.addEventListener("click",record);ui.stop.addEventListener("click",stop);ui.run.addEventListener("click",transcribe);ui.reset.addEventListener("click",reset);ui.reference.addEventListener("input",updateAccuracy);window.addEventListener("resize",paintWave);paintWave();
  </script>
</body>
</html>
